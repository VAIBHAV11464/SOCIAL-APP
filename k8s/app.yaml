apiVersion: v1
kind: Namespace
metadata:
  name: social-app-course
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: social-data-__VERSION__
  namespace: social-app-course
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-app-__VERSION__
  namespace: social-app-course
  labels:
    app: social-app
    version: __VERSION__
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: social-app
      version: __VERSION__
  template:
    metadata:
      labels:
        app: social-app
        version: __VERSION__
      annotations:
        course.build: "__BUILD__"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: social-app
          image: __IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DB_PATH
              value: /app/data/social.db
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: social-data-__VERSION__
---
apiVersion: v1
kind: Service
metadata:
  name: social-app-__VERSION__
  namespace: social-app-course
spec:
  type: NodePort
  selector:
    app: social-app
    version: __VERSION__
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: __PORT__
